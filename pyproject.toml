[project]
name = "mueta"
version = "1.0.0"
description = "Mueta —— Music meta auto to get"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "oodenX", email = "ven3428set@163.com"}]
dependencies = [
    "click>=8.3.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mutagen>=1.47.0",
    "pillow>=11.0.0",
    "platformdirs>=4.5.1",
    "pyacoustid>=1.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[project.scripts]
mueta = "mueta.main:main"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
