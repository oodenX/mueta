[project]
name = "mueta"
version = "0.1.0"
description = "Mueta —— Music meta auto to get"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "oodenX", email = "ven3428set@163.com"}]
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
