[project]
name = "mueta"
version = "0.3.0"
description = "Mueta —— Music meta auto to get"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "oodenX", email = "ven3428set@163.com"}]
dependencies = [
    "click>=8.3.1",
    "essentia-tensorflow>=2.1b6.dev1389",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mutagen>=1.47.0",
    "pillow>=11.0.0",
    "platformdirs>=4.5.0",
    "pyacoustid>=1.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pylast>=7.0.1",
    "rich>=14.0.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
# Basic audio analysis (BPM, Key, etc.)
analysis = [
    "essentia>=2.1b5",
]
# ML-based genre/mood prediction (requires TensorFlow)
ml = [
    "essentia-tensorflow>=2.1b6.dev1389",
]
# All features
all = [
    "essentia-tensorflow>=2.1b6.dev1389",
]

[project.scripts]
mueta = "mueta.main:main"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
