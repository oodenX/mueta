name: Build Release Packages

on:
  push:
    tags:
      - "v*"
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "VERSION=0.3.0-dev.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential libchromaprint-tools
          sudo gem install --no-document fpm

      - name: Run Build Script
        run: |
          chmod +x scripts/build/build_linux.sh
          ./scripts/build/build_linux.sh ${VERSION}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "VERSION=0.3.0-dev.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: Run Build Script
        shell: pwsh
        run: |
          .\scripts\build\build_windows.ps1 -Version $env:VERSION

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release/*

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Archive Build Scripts
        run: |
          mkdir -p release_scripts
          cp -r scripts/build/* release_scripts/
          tar -czvf build_scripts.tar.gz release_scripts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/**/*
            build_scripts.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}